services:
  backend:
    build: ./backend
    ports: ["8080:8000"]
    env_file: .env
    environment:
      - FRONTEND_URL=http://localhost:3005
    depends_on: [mongodb]
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time; must be reachable from the browser
        - VITE_API_URL=http://localhost:8080
    ports: ["3005:3000"]
    depends_on: [backend]
  mongodb:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-pass}
volumes:
  mongo_data:
